openapi: 3.0.3
info:
  title: KidsPOS API
  description: 子供向けPOSシステムのREST API
  version: 1.0.0
  contact:
    name: KidsPOS Team
    url: https://github.com/KidsPOSProject/KidsPOS-Server

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.kidspos.example.com
    description: Production server

tags:
  - name: Items
    description: 商品管理
  - name: Sales
    description: 売上管理
  - name: Stores
    description: 店舗管理
  - name: Settings
    description: 設定管理
  - name: Status
    description: サーバーステータス
  - name: Apk
    description: Androidアプリ配信

paths:
  # Status
  /api/status:
    get:
      tags:
        - Status
      summary: サーバーステータス取得
      description: サーバーの稼働状態、アプリケーションバージョン、API互換バージョン、プリンター到達性を取得します。クライアントは apiVersion を自身の対応バージョンと比較し、不一致の場合はアップデートを促してください
      operationId: getServerStatus
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  # Items
  /api/item:
    get:
      tags:
        - Items
      summary: 商品一覧取得
      description: 登録されている全商品を取得します
      operationId: getAllItems
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemResponse'

    post:
      tags:
        - Items
      summary: 商品登録
      description: 新しい商品を登録します
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Invalid request
        '409':
          description: Barcode already exists

  /api/item/{id}:
    get:
      tags:
        - Items
      summary: 商品取得
      description: 指定したIDの商品を取得します
      operationId: getItemById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '404':
          description: Item not found

    put:
      tags:
        - Items
      summary: 商品更新
      description: 指定したIDの商品を更新します
      operationId: updateItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '404':
          description: Item not found

    patch:
      tags:
        - Items
      summary: 商品部分更新
      description: 指定したIDの商品を部分的に更新します
      operationId: partialUpdateItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                barcode:
                  type: string
                name:
                  type: string
                price:
                  type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '404':
          description: Item not found

    delete:
      tags:
        - Items
      summary: 商品削除
      description: 指定したIDの商品を削除します
      operationId: deleteItem
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '404':
          description: Item not found

  /api/item/barcode/{barcode}:
    get:
      tags:
        - Items
      summary: バーコードで商品取得
      description: バーコードから商品を検索します
      operationId: getItemByBarcode
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
            pattern: '^A(00|01|02)[0-9]{6}A$'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        '400':
          description: Invalid barcode format
        '404':
          description: Item not found

  /api/item/barcode-pdf:
    get:
      tags:
        - Items
      summary: バーコードPDF生成
      description: 全商品のバーコードをPDF形式で生成します
      operationId: generateBarcodePdf
      responses:
        '200':
          description: Success
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # Sales
  /api/sales:
    get:
      tags:
        - Sales
      summary: 売上一覧取得
      description: 全売上データを取得します
      operationId: getAllSales
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SaleResponse'

    post:
      tags:
        - Sales
      summary: 売上登録
      description: 新しい売上を登録します
      operationId: createSale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: 売上ID
                  amount:
                    type: integer
                    description: 合計金額
                  quantity:
                    type: integer
                    description: 商品数
                  deposit:
                    type: integer
                    description: 預かり金額
                  change:
                    type: integer
                    description: おつり
                  storeId:
                    type: integer
                    description: 店舗ID
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sales/{id}:
    get:
      tags:
        - Sales
      summary: 売上詳細取得
      description: 指定したIDの売上詳細を取得します
      operationId: getSaleById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleResponse'
        '404':
          description: Sale not found

  /api/sales/validate-printer/{storeId}:
    get:
      tags:
        - Sales
      summary: プリンター設定確認
      description: 指定した店舗のプリンター設定を確認します
      operationId: validatePrinter
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean

  # Stores
  /api/stores:
    get:
      tags:
        - Stores
      summary: 店舗一覧取得
      description: 全店舗を取得します
      operationId: getAllStores
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreEntity'

    post:
      tags:
        - Stores
      summary: 店舗登録
      description: 新しい店舗を登録します
      operationId: createStore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreEntity'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEntity'

  /api/stores/{id}:
    get:
      tags:
        - Stores
      summary: 店舗取得
      description: 指定したIDの店舗を取得します
      operationId: getStoreById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEntity'
        '404':
          description: Store not found

    put:
      tags:
        - Stores
      summary: 店舗更新
      description: 店舗情報を更新します
      operationId: updateStore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreEntity'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreEntity'
        '404':
          description: Store not found

    delete:
      tags:
        - Stores
      summary: 店舗削除
      description: 店舗を削除します
      operationId: deleteStore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: No Content
        '404':
          description: Store not found

  # Settings
  /api/setting:
    get:
      tags:
        - Settings
      summary: 設定一覧取得
      description: 全設定を取得します
      operationId: getAllSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettingEntity'

    post:
      tags:
        - Settings
      summary: 設定作成
      description: 新しい設定を作成します
      operationId: createSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingEntity'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingEntity'

  /api/setting/status:
    get:
      tags:
        - Settings
      summary: ステータス取得
      description: APIのステータスを取得します。後方互換のため維持しています。/api/status を使用してください
      operationId: getStatus
      deprecated: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/setting/{key}:
    get:
      tags:
        - Settings
      summary: 設定取得
      description: 指定したキーの設定を取得します
      operationId: getSettingByKey
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingEntity'
        '404':
          description: Setting not found

    put:
      tags:
        - Settings
      summary: 設定更新
      description: 設定を更新します
      operationId: updateSetting
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
                - value
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingEntity'
        '404':
          description: Setting not found

    delete:
      tags:
        - Settings
      summary: 設定削除
      description: 設定を削除します
      operationId: deleteSetting
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '404':
          description: Setting not found

  /api/setting/printer/{storeId}:
    get:
      tags:
        - Settings
      summary: プリンター設定取得
      description: 店舗のプリンター設定を取得します
      operationId: getPrinterSettings
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  storeId:
                    type: integer
                  host:
                    type: string
                  port:
                    type: integer
        '404':
          description: Printer settings not found

    post:
      tags:
        - Settings
      summary: プリンター設定保存
      description: 店舗のプリンター設定を保存します
      operationId: savePrinterSettings
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
              required:
                - host
                - port
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  storeId:
                    type: integer
                  host:
                    type: string
                  port:
                    type: integer
                  message:
                    type: string

  /api/setting/application:
    get:
      tags:
        - Settings
      summary: アプリケーション設定取得
      description: アプリケーション全体の設定を取得します
      operationId: getApplicationSettings
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSetting'
        '404':
          description: Application settings not found

    post:
      tags:
        - Settings
      summary: アプリケーション設定保存
      description: アプリケーション全体の設定を保存します
      operationId: saveApplicationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationSetting'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverHost:
                    type: string
                  serverPort:
                    type: integer
                  message:
                    type: string

  # APK
  /api/apk/version/latest:
    get:
      tags:
        - Apk
      summary: 最新APKバージョン取得
      description: 配信対象になっているAPKのうち、最もバージョンコードが大きいものの情報を取得します
      operationId: getLatestApkVersion
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApkVersionResponse'
        '404':
          description: No active APK version

  /api/apk/version/check:
    get:
      tags:
        - Apk
      summary: アップデート確認
      description: クライアントの現在のバージョンコードより新しいAPKが配信されているかを確認します
      operationId: checkApkUpdate
      parameters:
        - name: currentVersionCode
          in: query
          required: true
          description: クライアントの現在のバージョンコード
          schema:
            type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCheckResponse'

  /api/apk/version/all:
    get:
      tags:
        - Apk
      summary: APKバージョン一覧取得
      description: 登録済みの全APKバージョン情報をバージョンコード降順で取得します
      operationId: getAllApkVersions
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApkVersionResponse'

  /api/apk/version/{id}:
    delete:
      tags:
        - Apk
      summary: APKバージョン削除
      description: 指定したAPKバージョンの登録情報とファイルを削除します
      operationId: deleteApkVersion
      parameters:
        - name: id
          in: path
          required: true
          description: APKバージョンID
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Deleted
        '404':
          description: APK version not found

  /api/apk/version/{id}/deactivate:
    put:
      tags:
        - Apk
      summary: APKバージョン無効化
      description: 指定したAPKバージョンを配信対象から外します
      operationId: deactivateApkVersion
      parameters:
        - name: id
          in: path
          required: true
          description: APKバージョンID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApkVersionResponse'
        '404':
          description: APK version not found

  /api/apk/download/{id}:
    get:
      tags:
        - Apk
      summary: APKファイルダウンロード
      description: 指定したAPKバージョンのファイルをダウンロードします。レスポンスが大きいため、クライアントはストリーミングで受信してください
      operationId: downloadApk
      parameters:
        - name: id
          in: path
          required: true
          description: APKバージョンID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary
        '404':
          description: APK file not found

  /api/apk/download/latest:
    get:
      tags:
        - Apk
      summary: 最新APKファイルダウンロード
      description: 最新バージョンのAPKファイルをダウンロードします。レスポンスが大きいため、クライアントはストリーミングで受信してください
      operationId: downloadLatestApk
      responses:
        '200':
          description: Success
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary
        '404':
          description: APK file not found

  /api/apk/upload:
    post:
      tags:
        - Apk
      summary: APKアップロード
      description: 新しいAPKファイルを登録します
      operationId: uploadApk
      parameters:
        - name: version
          in: query
          required: true
          description: バージョン名（例 1.2.3）
          schema:
            type: string
        - name: versionCode
          in: query
          required: true
          description: バージョンコード
          schema:
            type: integer
        - name: releaseNotes
          in: query
          required: false
          description: リリースノート
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: APKファイル
              required:
                - file
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApkVersionResponse'
        '400':
          description: Validation error
        '409':
          description: Version already exists


components:
  schemas:
    ItemResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        barcode:
          type: string
          example: "1234567890"
        name:
          type: string
          example: "ポテトチップス"
        price:
          type: integer
          example: 150
          description: 価格（リバー）
      required:
        - id
        - barcode
        - name
        - price

    CreateItemRequest:
      type: object
      properties:
        barcode:
          type: string
          pattern: '^A(00|01|02)[0-9]{6}A$'
          example: "A01000001A"
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "ポテトチップス"
        price:
          type: integer
          minimum: 0
          maximum: 99999
          example: 150
      required:
        - barcode
        - name
        - price

    SaleResponse:
      type: object
      properties:
        id:
          type: integer
          description: 売上ID
        storeId:
          type: integer
          description: 店舗ID
        storeName:
          type: string
          description: 店舗名
        totalAmount:
          type: integer
          description: 合計金額（リバー）
        deposit:
          type: integer
          description: 預り金（リバー）
        change:
          type: integer
          description: お釣り（リバー）
        saleTime:
          type: string
          format: date-time
          description: 売上時刻
        items:
          type: array
          description: 売上商品リスト
          items:
            $ref: '#/components/schemas/SaleItemResponse'
      required:
        - id
        - storeId
        - storeName
        - totalAmount
        - deposit
        - change
        - saleTime

    SaleItemResponse:
      type: object
      properties:
        itemId:
          type: integer
          description: 商品ID
        itemName:
          type: string
          description: 商品名
        barcode:
          type: string
          description: バーコード
        quantity:
          type: integer
          description: 数量
        unitPrice:
          type: integer
          description: 単価（リバー）
        subtotal:
          type: integer
          description: 小計（リバー）
      required:
        - itemId
        - itemName
        - barcode
        - quantity
        - unitPrice
        - subtotal

    CreateSaleRequest:
      type: object
      properties:
        storeId:
          type: integer
          description: 店舗ID
        itemIds:
          type: string
          description: 商品IDのカンマ区切り文字列（例："1,2,3"）
          example: "1,2,3"
        deposit:
          type: integer
          minimum: 0
          description: 預かり金額
      required:
        - storeId
        - itemIds
        - deposit


    StoreEntity:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        printerUri:
          type: string
      required:
        - name

    SettingEntity:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value

    ApplicationSetting:
      type: object
      properties:
        serverHost:
          type: string
        serverPort:
          type: integer
      required:
        - serverHost
        - serverPort

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          description: サーバーの稼働状態
          example: "OK"
        version:
          type: string
          description: アプリケーションバージョン（semver）
          example: "1.0.0"
        apiVersion:
          type: integer
          description: API互換バージョン。クライアント側で対応バージョンと比較する
          example: 1
        printer:
          $ref: '#/components/schemas/PrinterStatus'
      required:
        - status
        - version
        - apiVersion

    PrinterStatus:
      type: object
      description: 店舗に設定されたプリンターのTCP到達性
      properties:
        configured:
          type: boolean
          description: プリンターが1台以上設定されているか
          example: true
        reachable:
          type: boolean
          description: 設定済みプリンターすべてに到達可能か
          example: true
        total:
          type: integer
          description: 設定済みプリンターの台数（重複除外後）
          example: 2
        reachableCount:
          type: integer
          description: 到達可能なプリンターの台数
          example: 2
      required:
        - configured
        - reachable
        - total
        - reachableCount

    ApkVersionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: APKバージョンID
          example: 1
        version:
          type: string
          description: バージョン名（semver）
          example: "1.0.7"
        versionCode:
          type: integer
          description: バージョンコード
          example: 8
        fileName:
          type: string
          description: サーバー上のファイル名
          example: "kidspos-v1.0.7.apk"
        fileSize:
          type: integer
          format: int64
          description: ファイルサイズ（バイト）
          example: 12345678
        releaseNotes:
          type: string
          nullable: true
          description: リリースノート
        downloadUrl:
          type: string
          description: ダウンロード用のパス
          example: "/api/apk/download/1"
        uploadedAt:
          type: string
          description: アップロード時刻。サーバーのローカル時刻で、タイムゾーンを含まないISO-8601形式
          example: "2026-08-11T12:04:41.937"
        isActive:
          type: boolean
          description: 配信対象かどうか
          example: true
      required:
        - version
        - versionCode
        - fileName
        - fileSize
        - downloadUrl
        - uploadedAt
        - isActive

    UpdateCheckResponse:
      type: object
      properties:
        hasUpdate:
          type: boolean
          description: 新しいバージョンが存在するか
          example: true
        latestVersion:
          $ref: '#/components/schemas/ApkVersionResponse'
      required:
        - hasUpdate

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: エラーコード
          example: "VALIDATION_ERROR"
        message:
          type: string
          description: エラーメッセージ
          example: "商品IDが空です。売上作成には少なくとも1つの商品が必要です"
        timestamp:
          type: string
          format: date-time
          description: エラー発生時刻
        path:
          type: string
          nullable: true
          description: リクエストパス
        details:
          type: object
          nullable: true
          description: 追加の詳細情報
          additionalProperties: true
      required:
        - code
        - message
        - timestamp

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

# セキュリティは現在未実装のため、コメントアウト
