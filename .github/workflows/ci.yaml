name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Build, lint and test
        run: ./gradlew assembleProdDebug assembleDemoDebug lintProdDebug lintDemoDebug testProdDebugUnitTest testDemoDebugUnitTest
      - name: Record screenshots
        run: ./gradlew recordRoborazziProdDebug
      - name: Upload screenshots
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: screenshots
          path: app/screenshots
      - name: Build release
        run: ./gradlew assembleProdRelease
      - name: Publish screenshots to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin screenshots; then
            git worktree add screenshots-wt origin/screenshots
          else
            git worktree add --orphan screenshots-wt
          fi
          rm -rf "screenshots-wt/pr-${PR_NUMBER}"
          mkdir -p "screenshots-wt/pr-${PR_NUMBER}"
          cp app/screenshots/*.png "screenshots-wt/pr-${PR_NUMBER}/"
          cd screenshots-wt
          git add "pr-${PR_NUMBER}"
          if ! git diff --cached --quiet; then
            git commit -m "PR #${PR_NUMBER} のスクリーンショットを更新"
            for i in 1 2 3; do
              if git push origin HEAD:screenshots; then
                break
              fi
              git fetch origin screenshots
              git rebase origin/screenshots
            done
          fi
          commit=$(git rev-parse HEAD)
          {
            echo "<!-- roborazzi-screenshots -->"
            echo "## 全画面スクリーンショット"
            echo ""
            for f in pr-${PR_NUMBER}/*.png; do
              name=$(basename "$f" .png)
              echo "<details><summary>${name}</summary>"
              echo ""
              echo "![${name}](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${commit}/${f})"
              echo ""
              echo "</details>"
            done
          } > "${RUNNER_TEMP}/screenshots-comment.md"
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- roborazzi-screenshots -->")) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F "body=@${RUNNER_TEMP}/screenshots-comment.md"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${RUNNER_TEMP}/screenshots-comment.md"
          fi
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reports
          path: |
            app/build/reports/
