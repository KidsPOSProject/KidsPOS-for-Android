name: Build Apk

on:
  workflow_dispatch:

jobs:
  deploy-stg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set KeyStore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 が未設定のため、同梱の開発用キーストアで署名します"
          elif printf '%s' "$KEYSTORE_BASE64" | base64 -di > kidspos.tmp 2>/dev/null; then
            mv kidspos.tmp app/kidspos
          else
            rm -f kidspos.tmp
            echo "::warning::KEYSTORE_BASE64 を base64 として解釈できないため、同梱の開発用キーストアで署名します"
          fi
      - name: Build APK
        run: |
          ./gradlew clean assembleProdRelease
      - name: Deploy Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{secrets.FIREBASE_APP_ID}}
          token: ${{secrets.FIREBASE_TOKEN}}
          groups: device
          file: app/build/outputs/apk/prod/release/app-prod-release.apk
