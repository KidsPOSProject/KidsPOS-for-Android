name: Build Apk

# main が更新されるたびに APK をビルドし、GitHub Release として公開する。
# 版番は最新リリースタグから自動採番するため、build.gradle.kts の手編集は不要。

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

  workflow_dispatch:
    inputs:
      version_name:
        description: 'リリースする versionName（空なら最新リリースの patch を +1 して自動採番）'
        required: false
        type: string

# 連続した push で同じ版番を二重に採番しないよう、途中で打ち切らず順番に流す
concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  deploy-stg:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if ! RESOLVED=$(scripts/resolve-release-version.sh "${INPUT_VERSION_NAME}"); then
            echo "::error::リリース版番を決定できませんでした"
            exit 1
          fi
          read -r VERSION_NAME VERSION_CODE <<< "$RESOLVED"
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::リリース版番: ${VERSION_NAME} (versionCode ${VERSION_CODE})"
      - name: Set KeyStore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 が未設定のため、同梱の開発用キーストアで署名します"
          elif printf '%s' "$KEYSTORE_BASE64" | base64 -di > kidspos.tmp 2>/dev/null; then
            mv kidspos.tmp app/kidspos
          else
            rm -f kidspos.tmp
            echo "::warning::KEYSTORE_BASE64 を base64 として解釈できないため、同梱の開発用キーストアで署名します"
          fi
      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew assembleProdRelease \
            "-PkidsposVersionName=${VERSION_NAME}" \
            "-PkidsposVersionCode=${VERSION_CODE}"
      - name: Prepare release asset
        id: release_asset
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          APK_PATH="app/build/outputs/apk/prod/release/app-prod-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK が見つかりません: ${APK_PATH}"
            exit 1
          fi
          ASSET_PATH="build/release/kidspos-v${VERSION_NAME}.apk"
          mkdir -p "$(dirname "$ASSET_PATH")"
          cp "$APK_PATH" "$ASSET_PATH"
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version_name }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ASSET_PATH: ${{ steps.release_asset.outputs.asset_path }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_PATH" --clobber
            echo "::notice::既存リリース ${TAG} のアセットを差し替えました"
          else
            NOTES=$(printf 'KidsPOS Android アプリ\n\n- versionName: %s\n- versionCode: %s\n- 生成元コミット: %s\n\nサーバーの APK 管理画面 (/apk) にこの APK をアップロードすると、端末は /api/apk/download/latest から取得できます。\n' "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_SHA")
            gh release create "$TAG" "$ASSET_PATH" --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA"
            echo "::notice::リリース ${TAG} を作成しました"
          fi
      - name: Deploy Firebase App Distribution
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_APP_ID != ''
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1.7.1
        with:
          appId: ${{secrets.FIREBASE_APP_ID}}
          token: ${{secrets.FIREBASE_TOKEN}}
          groups: device
          file: app/build/outputs/apk/prod/release/app-prod-release.apk
